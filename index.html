  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>SITEVIA WORKS — Custom Websites for Businesses & Professionals</title>
    <meta name="description" content="SITEVIA WORKS creates modern, custom websites for businesses, creators, freelancers and professionals. Your Vision, Our Code." />
    <meta property="og:title" content="SITEVIA WORKS — Custom Websites for Businesses & Professionals" />

    <link rel="icon" type="image/png" href="/webviaworks-logo.png" />

    <script>
      // Strict light mode enforcement - ignore system dark mode
      try {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        document.documentElement.style.colorScheme = 'light';
        localStorage.setItem('viteweb_theme', 'light');
        localStorage.setItem('sitevia_theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 selection:bg-blue-600 selection:text-white antialiased">

  </body>
